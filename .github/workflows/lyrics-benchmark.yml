name: Lyrics benchmark and TypeScript checks

on:
  pull_request:
    paths:
      - "scripts/lyrics-benchmark/**"
      - "app/api/transcribe/route.ts"
      - "app/page.tsx"
      - ".github/workflows/lyrics-benchmark.yml"
      - "package.json"
      - "tsconfig.json"
  push:
    branches:
      - main
      - "feat/lyrics-transcription-pipeline"
    paths:
      - "scripts/lyrics-benchmark/**"
      - "app/api/transcribe/route.ts"
      - "app/page.tsx"
      - ".github/workflows/lyrics-benchmark.yml"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Evaluate WER/CER test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run benchmark unit tests
        run: python -m unittest discover -s scripts/lyrics-benchmark -p "test_*.py" -v

  typescript:
    name: TypeScript validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run TypeScript check
        run: npx tsc --noEmit
